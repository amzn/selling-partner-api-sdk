openapi: 3.0.1
info:
  contact:
    name: Selling Partner API Developer Support
    url: https://sellercentral.amazon.com/gp/mws/contactus.html
  description: The Selling Partner API for Fulfillment Outbound lets you create applications
    that help a seller fulfill Multi-Channel Fulfillment orders using their inventory
    in Amazon's fulfillment network. You can get information on both potential and
    existing fulfillment orders.
  license:
    name: Apache License 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  title: The Selling Partner API for Fulfillment Outbound
  version: 2026-07-04
servers:
- url: https://sellingpartnerapi-na.amazon.com/
paths:
  /fulfillment/outbound/2026-07-04/previews:
    post:
      description: |-
        Retrieve a list of fulfillment order previews based on shipping criteria that you specify.

        **Usage Plan:**

        | Rate (requests per second) | Burst |
        | ---- | ---- |
        | 2 | 30 |

        The `x-amzn-RateLimit-Limit` response header returns the usage plan rate limits that were applied to the requested operation, when available. The preceding table indicates the default rate and burst values for this operation. Selling partners whose business demands require higher throughput may see higher rate and burst values than those shown here. For more information, see [Usage Plans and Rate Limits in the Selling Partner API](https://developer-docs.amazon.com/sp-api/docs/usage-plans-and-rate-limits-in-the-sp-api).
      operationId: getOrderPreview
      parameters:
      - description: The identifier of the fulfillment service used for this operation.
        example: FS01-o8vlfw8b1tiu1
        in: header
        name: x-amzn-fulfillment-service-id
        schema:
          maxLength: 40
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOrderPreviewRequest'
        description: The request body schema for the `getOrderPreview` operation.
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                plannedShipments:
                - estimatedShippingWeight:
                    unit: KG
                    value: "2.0"
                  items:
                  - productIdentifier:
                      amazonSku: someSku
                    amount:
                      unit: EACHES
                      value: "1.0"
                  offers:
                  - fulfillmentConfiguration:
                      serviceLevel:
                        serviceTier: STANDARD
                        deliveryInterval:
                          startTime: 2025-04-21T12:34:56Z
                          endTime: 2025-04-22T12:34:56Z
                        shipInterval:
                          startTime: 2025-04-21T10:00:00Z
                          endTime: 2025-04-21T14:00:00Z
                      services:
                        packaging:
                          packagingOption: UNBRANDED
                        delivery:
                          paymentOnDelivery: ENABLED
                        additional: {}
                    estimatedPrice:
                      rollupPrices:
                      - type: MCFTransportationFee
                        value:
                          currencyCode: USD
                          amount: "4.25"
                      totalPrice:
                        currencyCode: USD
                        amount: "4.25"
                constraints:
                - message: There is not enough quantity of item xyz.
                  type: ValidationError
                  code: ItemQuantityNotAvailable
                  details:
                  - type: someType
                    value: someValue
              schema:
                $ref: '#/components/schemas/GetOrderPreviewResponse'
          description: Success.

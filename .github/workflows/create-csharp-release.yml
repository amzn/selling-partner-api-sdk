name: Create CSharp SDK Release

on:
  workflow_dispatch:
    inputs:
      newVersionNumber:
        type: string
        description: New version number
        required: true
  workflow_call:
    inputs:
      newVersionNumber:
        type: string
        required: true

env:
  SDK_VERSION: ${{ github.event.inputs.newVersionNumber }}

permissions:
  contents: write

jobs:
  release_csharp:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        
      - name: Install .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Set new version number
        working-directory: ./csharp/sdk/src/software.amzn.spapi
        env:
          NEW_VERSION: ${{ github.event.inputs.newVersionNumber }}
        run: |
          sed -i "s/.*<\/Version>/    <Version>${NEW_VERSION}<\/Version>/" software.amzn.spapi.csproj
          sed -i "s/public const string Version = \"0.0.0\";/public const string Version = \"${NEW_VERSION}\";/" Client/Configuration.cs

      - name: Restore dependencies
        working-directory: ./csharp/sdk/src/software.amzn.spapi
        run: dotnet restore
            
      - name: Build
        working-directory: ./csharp/sdk/src/software.amzn.spapi
        id: build-project
        run: dotnet build --configuration Release --no-restore
  
      - name: Pack
        working-directory: ./csharp/sdk/src/software.amzn.spapi
        id: pack-csharp
        run: |
            dotnet pack ./software.amzn.spapi.csproj --configuration Release

      - name: PushNuget
        working-directory: ./csharp/sdk/src/software.amzn.spapi
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_TOKEN }}
        run: dotnet nuget push "**/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  tag_and_release:
    needs: [ release_csharp ]
    uses: ./.github/workflows/create-tag-release.yml
    with:
      tagName: "csharp-${{ github.event.inputs.newVersionNumber }}"